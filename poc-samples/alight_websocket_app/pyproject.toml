[tool.poetry]
name = "bedrock-agent-websocket-handlers"
version = "0.1.0"
description = "Lambda handlers for Bedrock Agent WebSocket API"
authors = ["Leslie Daniel Raj ldraj@amazon.com"]
packages = [
    { include = "handlers" },
]

[tool.poetry.dependencies]
python = "^3.9"
aws-cdk-lib = "2.128.0"
constructs = ">=10.0.0,<11.0.0"
boto3 = ">=1.34.14"
botocore = ">=1.34.14"
aioboto3 = ">=12.3.0"
aws-lambda-powertools = ">=2.30.2"
jsonschema = ">=4.20.0"
pyjwt = ">=2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
isort = "^5.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3

